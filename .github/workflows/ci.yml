# -----------------------------------------------------------------------------
# File:    .github/workflows/ci.yml
# Paper:   Gauran, Xue, Chen, Ombao, Yu (2022). Front. Neurosci. 16:836100.
# Purpose: Continuous integration: run `nix flake check` on every push and
#          pull request. The check builds every table and figure from the
#          archived runs, compares them with the paper, compares the R and
#          the Python outputs, and runs the unit tests of both (README.md,
#          sections Running and Tests). No private data is needed.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --print-build-logs
